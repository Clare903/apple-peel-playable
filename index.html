<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#f4efe3" />
  <title>Peel — Apple Peeling</title>
  <style>
    :root { color-scheme: light; --ink:#28231f; --red:#9c1830; --paper:#f4efe3; }
    * { box-sizing: border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#d8c7a8; font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; }
    body { display:grid; place-items:center; touch-action:none; user-select:none; }
    #game { position:relative; width:min(100vw,100vh); height:min(100vw,100vh); max-width:900px; max-height:900px; overflow:hidden; container-type:inline-size; background:var(--paper); box-shadow:0 26px 80px #4f382e42; }
    canvas { display:block; width:100%; height:100%; cursor:grab; }
    canvas:active { cursor:grabbing; }
    .controls { position:absolute; top:18px; right:18px; display:flex; gap:8px; z-index:5; }
    button { border:0; font:inherit; }
    .icon-btn { width:42px; height:42px; display:grid; place-items:center; border-radius:50%; color:#3b332d; background:#fff8; backdrop-filter:blur(10px); box-shadow:0 4px 18px #49372818; cursor:pointer; transition:.2s ease; }
    .icon-btn:hover { transform:translateY(-1px); background:#fffc; }
    .icon-btn:active { transform:scale(.94); }
    .panel { position:absolute; top:13%; right:9%; width:min(63%,330px); z-index:4; visibility:hidden; opacity:0; transition:opacity .35s ease; }
    .panel.show { visibility:visible; opacity:1; }
    .card { padding:clamp(12px,2.6cqw,24px); border-radius:8px; background:#fdf9ee; box-shadow:0 5px 15px #52392521; text-align:center; color:var(--ink); }
    h1 { margin:0; font-family:Georgia,serif; font-size:clamp(22px,4cqw,36px); letter-spacing:.06em; }
    .result-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin:clamp(10px,2cqw,18px) 0; }
    .result span { display:block; font-size:clamp(10px,1.6cqw,13px); color:#766050; }
    .result b { display:block; margin-top:4px; font-family:Georgia,serif; font-size:clamp(16px,3cqw,25px); }
    .primary { padding:9px 19px; border-radius:5px; background:#8e1730; color:#fff; font-size:clamp(12px,1.8cqw,15px); font-weight:700; cursor:pointer; transition:.2s ease; }
    .primary:hover { transform:translateY(-2px); background:#a01936; }
    .tip { margin:8px 0 0; font-size:clamp(10px,1.55cqw,13px); color:#7d6a5f; }
    .toast { position:absolute; left:50%; bottom:23%; translate:-50% 8px; z-index:7; padding:9px 16px; border-radius:999px; color:#fff; background:#401c1dde; font-size:13px; font-weight:700; letter-spacing:.08em; opacity:0; transition:.2s; pointer-events:none; }
    .toast.show { opacity:1; translate:-50% 0; }
    @media (max-aspect-ratio:1/1) { #game { box-shadow:none; } }
  </style>
</head>
<body>
  <main id="game" aria-label="Apple peeling game. Press and slowly drag right to peel.">
    <canvas id="canvas" width="900" height="900"></canvas>
    <div class="controls">
      <button id="sound" class="icon-btn" aria-label="Sound" aria-pressed="true" title="Toggle sound">♪</button>
      <button id="restart" class="icon-btn" aria-label="Restart" title="Restart">↻</button>
    </div>
    <div id="toast" class="toast" aria-hidden="true">Too fast. The peel snapped!</div>
    <section id="finish" class="panel" aria-hidden="true">
      <div class="card">
        <h1>All peeled</h1>
        <div class="result-grid">
          <div class="result"><span>Longest strip</span><b id="bestLen">0 cm</b></div>
          <div class="result"><span>Strips</span><b id="stripCount">0</b></div>
          <div class="result"><span>Score</span><b id="score">0</b></div>
        </div>
        <button id="again" class="primary">Peel another</button>
        <p id="record" class="tip"></p>
      </div>
    </section>
  </main>

  <script>
  (() => {
    'use strict';
    const canvas = document.querySelector('#canvas');
    const ctx = canvas.getContext('2d');
    const finish = document.querySelector('#finish');
    const toast = document.querySelector('#toast');
    const soundBtn = document.querySelector('#sound');
    const W = 900, H = 900, FLOOR = 643;
    const apple = { x:423, y:372 };
    let activePointer = null, lastX=0, lastT=0, dragSpeed=0, fastDistance=0, progress=0, rotation=0;
    let stripDistance=0, strips=0, bestLength=0, totalDistance=0;
    let finishedAt=null, started=false, toastTimer=0, finishTimer=0;
    let soundOn=true, audio=null, scrapeGain=null, scrapeUntil=0;
    const requiredDistance=3350;
    const fallen=[];
    const cmPerUnit = .042;

    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    const lerp=(a,b,t)=>a+(b-a)*t;
    const smooth=t=>t*t*(3-2*t);
    const peelLength=()=>Math.floor(stripDistance*cmPerUnit);

    function fit(){
      const rect=canvas.getBoundingClientRect();
      const dpr=Math.min(window.devicePixelRatio||1,2);
      canvas.width=Math.round(rect.width*dpr); canvas.height=Math.round(rect.height*dpr);
      ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
    }
    addEventListener('resize',fit); fit();

    function reset(){
      endDrag();
      progress=0; rotation=0; stripDistance=0; strips=0;
      bestLength=0; totalDistance=0; finishedAt=null; started=false;
      clearTimeout(finishTimer);
      clearTimeout(toastTimer);
      toast.classList.remove('show');
      toast.setAttribute('aria-hidden','true');
      fallen.length=0; finish.classList.remove('show'); finish.setAttribute('aria-hidden','true');
    }

    function initAudio(){
      if(!soundOn) return;
      if(!audio){
        const Audio = window.AudioContext || window.webkitAudioContext;
        if(!Audio) return;
        audio=new Audio();
        prepareScrape();
      }
      if(audio.state!=='running') audio.resume().catch(()=>{});
    }
    function scrapeLoopBounds(buffer){
      const rate=buffer.sampleRate;
      const signal=buffer.getChannelData(0);
      const end=buffer.length-Math.round(rate*.022);
      const start=Math.round(rate*.048);
      const last=Math.round(rate*.092);
      let match=start, best=Infinity;
      // Choose adjacent samples with similar shape at the repeat point.
      for(let i=start;i<=last;i++){
        let error=0;
        for(let j=0;j<12;j++) error+=(signal[i-12+j]-signal[end-12+j])**2;
        if(error<best){best=error; match=i;}
      }
      return [match/rate,end/rate];
    }
    async function prepareScrape(){
      try {
        const bytes=Uint8Array.from(atob(peelClip),character=>character.charCodeAt(0));
        const buffer=await audio.decodeAudioData(bytes.buffer);
        const [start,end]=scrapeLoopBounds(buffer);
        const source=audio.createBufferSource();
        source.buffer=buffer;
        source.loop=true;
        source.loopStart=start;
        source.loopEnd=end;
        scrapeGain=audio.createGain();
        scrapeGain.gain.value=0;
        source.connect(scrapeGain).connect(audio.destination);
        source.start(0,start);
        updateScrape();
      } catch(error) {
        console.warn('Could not decode the peel sound.',error);
      }
    }
    function updateScrape(){
      if(!scrapeGain) return;
      const now=audio.currentTime;
      const remaining=soundOn?Math.max(0,(scrapeUntil-performance.now())/1000):0;
      const gain=scrapeGain.gain;
      gain.cancelScheduledValues(now);
      if(remaining) gain.setTargetAtTime(1,now,.008);
      gain.setTargetAtTime(0,now+remaining,.012);
    }
    function scrape(){
      if(!soundOn) return;
      scrapeUntil=performance.now()+130;
      updateScrape();
    }
    function stopScrape(){
      scrapeUntil=0;
      updateScrape();
    }
    function releaseStrip(fast=false){
      if(!stripDistance) return;
      bestLength=Math.max(bestLength,peelLength());
      fallen.push({ distance:stripDistance, index:strips-1, tip:peelTip(), at:performance.now() });
      stripDistance=0;
      if(fast){
        toast.classList.add('show');
        toast.setAttribute('aria-hidden','false');
        clearTimeout(toastTimer);
        toastTimer=setTimeout(()=>{
          toast.classList.remove('show');
          toast.setAttribute('aria-hidden','true');
        },1050);
      }
    }
    function finishGame(){
      finishedAt=performance.now();
      endDrag();
      releaseStrip();
      const used=Math.max(1,strips);
      const score=Math.max(0,Math.round(1000+bestLength*18-used*70));
      let old=0;
      try {
        old=Number(localStorage.getItem('peel-best'))||0;
        if(score>old) localStorage.setItem('peel-best',score);
      } catch {
        // Some browsers disable storage when the HTML is opened as a local file.
      }
      document.querySelector('#bestLen').textContent=bestLength+' cm';
      document.querySelector('#stripCount').textContent=used;
      document.querySelector('#score').textContent=score;
      document.querySelector('#record').textContent=score>old?'New personal best!':'Personal best: '+old;
      finishTimer=setTimeout(()=>{ finish.classList.add('show'); finish.setAttribute('aria-hidden','false'); },1050);
    }

    function pointerX(e){
      const r=canvas.getBoundingClientRect(); return (e.clientX-r.left)/r.width*W;
    }
    function endDrag(){
      const pointer=activePointer;
      activePointer=null;
      stopScrape();
      if(pointer!==null && canvas.hasPointerCapture(pointer)) canvas.releasePointerCapture(pointer);
    }
    canvas.addEventListener('pointerdown',e=>{
      if(finishedAt!==null || activePointer!==null || e.button!==0) return;
      initAudio();
      canvas.setPointerCapture(e.pointerId);
      activePointer=e.pointerId;
      lastX=pointerX(e);
      lastT=e.timeStamp;
      dragSpeed=0;
      fastDistance=0;
    });
    canvas.addEventListener('pointermove',e=>{
      if(e.pointerId!==activePointer) return;
      const x=pointerX(e), now=e.timeStamp, dx=x-lastX;
      const dt=Math.max(8,now-lastT);
      lastX=x; lastT=now;
      if(dt>120){
        dragSpeed=0;
        fastDistance=0;
      }
      dragSpeed=lerp(dragSpeed,Math.max(0,dx)/dt*1000,.45);
      fastDistance=dragSpeed>1650 && dx>0?fastDistance+dx:0;
      if(dx<=0){
        if(dx < -1) stopScrape();
        return;
      }
      if(fastDistance>46 && stripDistance>=36){
        releaseStrip(true);
        endDrag();
        return;
      }
      const useful=Math.min(dx,42,requiredDistance-totalDistance);
      if(!stripDistance) strips++;
      started=true;
      stripDistance+=useful;
      totalDistance+=useful;
      progress=totalDistance/requiredDistance;
      rotation+=useful*.019;
      scrape();
      if(progress>=1) finishGame();
    });
    function pointerUp(e){ if(e.pointerId===activePointer) endDrag(); }
    for(const type of ['pointerup','pointercancel','lostpointercapture']) canvas.addEventListener(type,pointerUp);
    document.querySelector('#restart').onclick=reset; document.querySelector('#again').onclick=reset;
    soundBtn.onclick=()=>{
      soundOn=!soundOn;
      soundBtn.textContent=soundOn?'♪':'×';
      soundBtn.setAttribute('aria-pressed',String(soundOn));
      if(soundOn) initAudio();
      if(!soundOn) stopScrape();
    };

    function roundRect(x,y,w,h,r){
      ctx.beginPath(); ctx.roundRect(x,y,w,h,r); return ctx;
    }
    function drawBackground(){
      const wall=ctx.createRadialGradient(420,282,40,420,282,680);
      wall.addColorStop(0,'#f2ede1'); wall.addColorStop(1,'#dfd7c7');
      ctx.fillStyle=wall; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='rgba(93,75,62,.055)'; ctx.lineWidth=1;
      for(let x=0;x<W;x+=75){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,FLOOR); ctx.stroke(); }
      for(let y=0;y<FLOOR;y+=75){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
      ctx.fillStyle='#5d3b2b'; ctx.fillRect(0,FLOOR-12,W,17);
      const floor=ctx.createLinearGradient(0,FLOOR,0,H); floor.addColorStop(0,'#ead2a0'); floor.addColorStop(1,'#d6b785');
      ctx.fillStyle=floor; ctx.fillRect(0,FLOOR+5,W,H-FLOOR);
      ctx.strokeStyle='rgba(126,82,40,.12)'; ctx.lineWidth=1;
      for(let x=-200;x<W+200;x+=34){
        ctx.beginPath(); ctx.moveTo(450+(x-450)*.35,FLOOR+5); ctx.lineTo(x,H); ctx.stroke();
      }
    }
    function shadow(x,y,width,height,opacity){
      ctx.save();
      ctx.translate(x,y);
      ctx.scale(width,height);
      const g=ctx.createRadialGradient(0,0,0,0,0,1);
      g.addColorStop(0,`rgba(60,37,17,${opacity})`);
      g.addColorStop(1,'rgba(60,37,17,0)');
      ctx.fillStyle=g;
      ctx.fillRect(-1,-1,2,2);
      ctx.restore();
    }
    function applePath(){
      ctx.beginPath();
      ctx.moveTo(0,-160);
      ctx.bezierCurveTo(-98,-161,-170,-107,-181,-33);
      ctx.bezierCurveTo(-196,72,-110,155,-18,160);
      ctx.bezierCurveTo(79,170,165,112,181,25);
      ctx.bezierCurveTo(200,-67,125,-163,0,-160);
      ctx.closePath();
    }
    function surfaceLight(x,y){
      const nx=x/192, ny=y/174;
      const nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));
      return .46+.53*Math.max(0,-.49*nx-.52*ny+.70*nz);
    }
    const fruitWidth=186, fruitHeight=167;
    const ringTilt=.44;
    const ringUpright=Math.sqrt(1-ringTilt**2);
    const ringLatitude=()=>lerp(-.994,ringUpright,progress**1.17);
    function surfaceLatitude(x,y){
      const horizontal=x/fruitWidth, vertical=y/fruitHeight;
      const depth=Math.sqrt(Math.max(0,1-horizontal**2-vertical**2));
      return vertical*ringUpright-depth*ringTilt;
    }
    function ringProjection(latitude,x){
      const depth=Math.sqrt(Math.max(0,1-latitude**2-(x/fruitWidth)**2));
      return {middle:latitude*ringUpright*fruitHeight, bow:depth*ringTilt*fruitHeight};
    }
    function cutRelief(x,y){
      // Follow the latitude of the fruit surface as the knife wraps around it.
      const cut=(surfaceLatitude(x,y)+1)/2;
      const phase=cut*8.1+x*.00065+.025*Math.sin(x*.033+y*.024);
      const turn=phase-Math.floor(phase);
      const edge=Math.exp(-(((turn-.20)/.17)**2));
      const lip=Math.exp(-(((turn-.45)/.26)**2));
      const strength=(.45+.55*Math.cos(x*.005)**2)*smooth(clamp(cut*8,0,1));
      return strength*(.017*lip-.031*edge);
    }
    function appleSurface(peeled){
      const surface=document.createElement('canvas');
      surface.width=400;
      surface.height=344;
      const brush=surface.getContext('2d');
      const pixels=brush.createImageData(surface.width,surface.height);
      let grain=7471;
      for(let py=0;py<surface.height;py++){
        for(let px=0;px<surface.width;px++){
          const x=px-200, y=py-172;
          const diffuse=surfaceLight(x,y);
          const reflection=Math.exp(-((x+66)**2+(y+51)**2)/2650);
          const smallHighlight=Math.exp(-((x+62)**2+(y+54)**2)/230);
          const hollow=Math.exp(-((x+1)**2/2450+(y+121)**2/500));
          const core=Math.exp(-((x+2)**2/660+(y+119)**2/106));
          const rim=Math.exp(-((x+24)**2/4300+(y+142)**2/670))*(1-hollow);
          grain=(Math.imul(grain,1664525)+1013904223)>>>0;
          const noise=grain/4294967296-.5;
          const grainLight=2.4*Math.sin(x*.076+y*.095)*Math.sin(y*.069-x*.031)
            +1.3*Math.sin(x*.22+y*.16)*Math.sin(x*.073-y*.18)+noise*3.5;
          const i=(py*surface.width+px)*4;
          if(peeled){
            const light=diffuse+cutRelief(x,y)*(1-hollow)-hollow*.21-core*.51+rim*.07+reflection*.045;
            pixels.data[i]=255*light+grainLight+9;
            pixels.data[i+1]=232*light+grainLight+9;
            pixels.data[i+2]=177*light+grainLight+8;
          }else{
            const light=diffuse**2.48*(1-.55*hollow-.33*core);
            const latitude=y/174;
            const longitude=Math.atan2(x/192,Math.sqrt(Math.max(.025,1-(x/192)**2-latitude**2)));
            const streak=Math.sin(longitude*19+latitude*.6+.65*Math.sin(latitude*4.3))
              +.44*Math.sin(longitude*49-latitude*2.6);
            const blush=Math.sin(longitude*5+latitude*2.3)+.64*Math.cos(longitude*11-latitude*6);
            const bloom=(9*streak+12*blush)*light;
            const lenticel=noise>.496?12*light:0;
            pixels.data[i]=32+177*light+reflection*24+smallHighlight*89+grainLight+bloom+lenticel;
            pixels.data[i+1]=12+20*light+reflection*22+smallHighlight*165+grainLight*.65+bloom*.43+lenticel;
            pixels.data[i+2]=12+22*light+reflection*18+smallHighlight*152+grainLight*.55-bloom*.12+lenticel*.7;
          }
          pixels.data[i+3]=255;
        }
      }
      brush.putImageData(pixels,0,0);
      return surface;
    }
    const skin=appleSurface(false);
    const flesh=appleSurface(true);

    function peelEdgeVariation(x){
      return 1.5*Math.sin(x*.032+rotation*.48)+.8*Math.sin(x*.091-rotation*.63);
    }
    function clipPeeledFlesh(){
      const latitude=ringLatitude();
      const radius=fruitWidth*Math.sqrt(Math.max(0,1-latitude**2));
      const width=latitude<0?radius:200;
      const steps=Math.max(2,Math.ceil(width));
      const upper=[], lower=[];
      for(let i=0;i<=steps;i++){
        const x=lerp(-width,width,i/steps);
        const section=Math.sqrt(Math.max(0,1-(x/fruitWidth)**2));
        const {middle,bow}=ringProjection(latitude,x);
        const uneven=peelEdgeVariation(x);
        const cap=latitude< -section*ringUpright;
        const full=latitude>=section*ringUpright;
        upper.push([x,cap?middle-bow+uneven:-180]);
        lower.push([x,full?180:middle+bow+uneven]);
      }
      ctx.beginPath();
      ctx.moveTo(...upper[0]);
      for(let i=1;i<upper.length;i++) ctx.lineTo(...upper[i]);
      for(let i=lower.length-1;i>=0;i--) ctx.lineTo(...lower[i]);
      ctx.closePath();
      ctx.clip();
    }
    function drawApple(pose){
      ctx.save();
      ctx.translate(pose.x,pose.y);
      ctx.scale(pose.scale,pose.scale);
      ctx.save();
      applePath();
      ctx.clip();
      if(progress<1){
        ctx.drawImage(skin,-200,-172);
        for(let i=0;i<4;i++){
          const phase=rotation+i*Math.PI/2;
          const visibility=Math.max(0,Math.cos(phase));
          const x=135*Math.sin(phase), y=30*Math.sin(i*2.8);
          const blush=ctx.createRadialGradient(x,y,8,x,y,70);
          blush.addColorStop(0,`rgba(255,104,38,${.105*visibility})`);
          blush.addColorStop(1,'rgba(255,104,38,0)');
          ctx.fillStyle=blush;
          ctx.fillRect(x-70,y-70,140,140);
        }
      }
      if(progress>=1){
        ctx.drawImage(flesh,-200,-172);
      }else if(progress>0){
        clipPeeledFlesh();
        ctx.drawImage(flesh,-200,-172);
      }
      ctx.restore();

      ctx.translate(0,-119);
      ctx.rotate(Math.sin(rotation)*.11-.065);
      const stem=ctx.createLinearGradient(-8,0,9,0);
      stem.addColorStop(0,'#422b15');
      stem.addColorStop(.45,'#72532b');
      stem.addColorStop(1,'#392714');
      ctx.fillStyle=stem;
      ctx.beginPath();
      ctx.moveTo(-8,1);
      ctx.quadraticCurveTo(-6,-20,-5,-48);
      ctx.quadraticCurveTo(-5,-55,2,-54);
      ctx.quadraticCurveTo(8,-54,8,-48);
      ctx.lineTo(9,0);
      ctx.quadraticCurveTo(1,5,-8,1);
      ctx.fill();
      ctx.restore();
    }

    function peelTip(){
      const latitude=ringLatitude();
      const radius=fruitWidth*Math.sqrt(Math.max(0,1-latitude**2));
      const x=Math.min(radius*.72,23+91*Math.sin(Math.PI*progress**.72));
      const {middle,bow}=ringProjection(latitude,x);
      return {x:apple.x+x,y:apple.y+middle+bow+peelEdgeVariation(x)+3};
    }

    const curlAnchors=[
      {x:525,y:774,angle:-.13},{x:594,y:754,angle:2.50},{x:470,y:762,angle:-.68},
      {x:506,y:799,angle:1.28},{x:624,y:787,angle:-1.14},{x:545,y:755,angle:3.07}
    ];
    // The same connected strip passes through loose arches and tighter bends.
    // Each point stores horizontal position, table depth and height above the wood.
    const curlKnots=[
      [0,0,3],[8,25,5],[32,47,8],[64,58,25],[83,43,57],[76,16,81],
      [47,-8,83],[16,-9,61],[3,8,33],[-13,35,10],[-45,45,4],[-76,28,7],
      [-105,5,19],[-124,-24,41],[-106,-49,57],[-77,-55,46],[-56,-29,23],
      [-64,-6,8],[-91,14,5],[-114,36,17],[-121,51,46],[-103,60,61],
      [-73,54,44],[-44,40,19],[-14,33,5],[25,22,7],[48,-5,22],
      [50,-37,54],[29,-66,65],[3,-72,43],[-11,-55,17],[11,-40,5],
      [53,-45,7],[94,-54,16],[121,-57,44],[130,-35,70],[114,-9,65],
      [87,1,39],[91,26,25],[111,45,10],[142,55,5],[162,47,9],[174,27,17]
    ];
    function spline(a,b,c,d,t){
      return b+.5*t*(c-a+t*(2*a-5*b+4*c-d+t*(3*(b-c)+d-a)));
    }
    const curlSamples=[{x:0,depth:0,height:3,distance:0}];
    for(let i=0;i<curlKnots.length-1;i++){
      const a=curlKnots[Math.max(0,i-1)], b=curlKnots[i];
      const c=curlKnots[i+1], d=curlKnots[Math.min(curlKnots.length-1,i+2)];
      for(let j=1;j<=9;j++){
        const [x,depth,height]=b.map((value,k)=>spline(a[k],value,c[k],d[k],j/9));
        const prev=curlSamples.at(-1);
        const distance=prev.distance+Math.hypot(x-prev.x,depth-prev.depth,height-prev.height);
        curlSamples.push({x,depth,height,distance});
      }
    }
    const curlScale=(curlSamples.at(-1).distance-1)/(requiredDistance*.72);
    const cameraDown=.62;
    const cameraUp=Math.sqrt(1-cameraDown**2);

    function tablePoint(distance,anchor,settle,index){
      const target=distance*curlScale;
      let low=0, high=curlSamples.length-1;
      while(high-low>1){
        const mid=(low+high)>>1;
        if(curlSamples[mid].distance<target) low=mid;

      const t=clamp((target-a.distance)/(b.distance-a.distance),0,1);
      const compression=Math.sin(settle*Math.PI)**2;
      const falloff=Math.exp(-target/220);
      const x=lerp(a.x,b.x,t)*(1+.11*compression*falloff);

      const height=Math.max(3,lerp(a.height,b.height,t));
      const cos=Math.cos(anchor.angle), sin=Math.sin(anchor.angle);
      const variation=1+.13*Math.sin(index*2.3+target*.008);

        height:3+(height-3)*variation*(1.12-.12*settle-.27*compression*falloff),

    function ribbonFaces(distance,index,tip,elapsed=0){
      const length=distance*.72;
      const anchor=curlAnchors[index%curlAnchors.length];
      const drop=clamp(elapsed/.72,0,1)**2;
      const settle=clamp((elapsed-.40)/.60,0,1);
      const topHeight=lerp((anchor.y-tip.y)/cameraUp,3,drop);
      const topX=(tip.x-anchor.x)*(1-drop);
      const hang=(topHeight-3)*cameraUp*1.035;
      const count=Math.max(1,Math.ceil(length/7));
      const hangingTwist=s=>Math.max(0,s-135)*.026+.26*Math.sin(s*.034);
      const contactTwist=hangingTwist(hang);
      const points=[];
      for(let i=0;i<=count;i++){
        const s=i/count*length;
        const taper=lerp(.81,1,smooth(Math.min(1,(length-s)/22)));
        const width=(19+.8*Math.sin(s*.032+index)+.6*Math.cos(s*.077))*taper;
        if(s>=hang){
          const coil=tablePoint(s-hang,anchor,settle,index);
          const roll=contactTwist+coil.roll+smooth(Math.min(1,(s-hang)/85))*.38*Math.sin(index);
          points.push({...coil,roll,width});
        }else{
          const t=s/hang;
          const sway=(10+12*drop)*Math.sin(s*.028+index)*Math.sin(Math.PI*t);
          const x=topX*(1-smooth(t))+sway;
          const depth=9*Math.sin(s*.017+index)*Math.sin(Math.PI*t);
          points.push({x,depth,height:lerp(topHeight,3,t),roll:hangingTwist(s),width});

        const prev=points[Math.max(0,i-1)], next=points[Math.min(count,i+1)];
        const dx=next.x-prev.x, dy=next.depth-prev.depth, dz=next.height-prev.height;
        const screenY=dy*cameraDown-dz*cameraUp;
        const span=Math.hypot(dx,screenY)||1;
        const sideX=screenY/span, sideY=-dx/span;
        const x=anchor.x+point.x;
        const y=anchor.y+point.depth*cameraDown-point.height*cameraUp;
        const face=Math.cos(point.roll);
        const width=point.width*Math.hypot(face,.15);
        const depth=point.depth*cameraUp+point.height*cameraDown;
        const tableY=anchor.y+point.depth*cameraDown;
        return {...point,face,depth,x,tableY,lx:x+sideX*width,ly:y+sideY*width,

        const pigment=13*Math.sin(s*.027+index)+9*Math.cos(s*.011-index)+3*Math.sin(s*.179);
        const red=[149+pigment,39+pigment*.38,37+pigment*.17];
        const cream=[238,216,162];
        const color=red.map((v,k)=>lerp(v,cream[k],inside)*light*shade);
        faces.push({a,b,color,inside,depth:(a.depth+b.depth)*.5});
      }
      return faces;
    }

    function visiblePeelFaces(now){
      const faces=[];
      for(const strip of fallen){
        const elapsed=clamp((now-strip.at)/830,0,1);
        const mesh=strip.mesh || ribbonFaces(strip.distance,strip.index,strip.tip,elapsed);
        if(elapsed===1) strip.mesh=mesh;

    function drawPeelShadows(faces){
      ctx.save();

      for(const {limit,opacity,width} of [
        {limit:72,opacity:.07,width:25},
        {limit:17,opacity:.15,width:12}

        ctx.beginPath();

          if((a.height+b.height)*.5>limit) continue;
          ctx.moveTo(a.x+5,a.tableY+2);
          ctx.lineTo(b.x+5,b.tableY+2);
        }
        ctx.strokeStyle=`rgba(62,34,18,${opacity})`;
        ctx.lineWidth=width;
        ctx.stroke();

      ctx.restore();
    }
    function drawPeels(faces){
      faces.sort((a,b)=>a.depth-b.depth);

        const [r,g,blue]=color.map(Math.round);
        ctx.fillStyle=ctx.strokeStyle=`rgb(${r},${g},${blue})`;
        ctx.lineWidth=.8;
        ctx.lineJoin='round';
        ctx.beginPath();
        ctx.moveTo(a.lx,a.ly);
        ctx.lineTo(b.lx,b.ly);
        ctx.lineTo(b.rx,b.ry);
        ctx.lineTo(a.rx,a.ry);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle=inside>.5?'#a58c5964':'#4d1e1c85';
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(a.lx,a.ly);
        ctx.lineTo(b.lx,b.ly);
        ctx.moveTo(a.rx,a.ry);
        ctx.lineTo(b.rx,b.ry);
        ctx.stroke();
        ctx.strokeStyle=inside>.5?'#ffefd350':'#ffc29544';
        ctx.lineWidth=1.55;
        ctx.beginPath();
        ctx.moveTo(lerp(a.lx,a.rx,.24),lerp(a.ly,a.ry,.24));
        ctx.lineTo(lerp(b.lx,b.rx,.24),lerp(b.ly,b.ry,.24));

      }
    }
